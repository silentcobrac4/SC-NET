name: Build and Release SC NET APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract app-source.zip
        run: |
          if [ ! -f "app-source.zip" ]; then
            echo "Error: app-source.zip not found in repository root." >&2
            exit 1
          fi
          mkdir -p extracted_src
          unzip -q app-source.zip -d extracted_src

      - name: Locate Gradle project root
        id: locate_gradle
        run: |
          GRADLE_DIR=$(find extracted_src -maxdepth 3 -name "gradlew" -printf "%h\n" | head -n 1)
          if [ -z "$GRADLE_DIR" ]; then
            echo "Error: Could not find gradlew inside app-source.zip." >&2
            exit 1
          fi
          echo "gradle_dir=$GRADLE_DIR" >> "$GITHUB_OUTPUT"
          chmod +x "$GRADLE_DIR/gradlew"

      - name: Build Release APK
        run: |
          cd "${{ steps.locate_gradle.outputs.gradle_dir }}"
          ./gradlew assembleRelease --no-daemon

      - name: Verify APK artifacts exist
        id: verify_apk
        run: |
          APK_COUNT=$(find "${{ steps.locate_gradle.outputs.gradle_dir }}" -path "*/build/outputs/apk/release/*.apk" | wc -l)
          if [ "$APK_COUNT" -eq 0 ]; then
            echo "Error: assembleRelease completed without producing any APK file." >&2
            exit 1
          fi
          echo "apk_found=true" >> "$GITHUB_OUTPUT"
          find "${{ steps.locate_gradle.outputs.gradle_dir }}" -path "*/build/outputs/apk/release/*.apk"

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SC-NET-release-apk
          path: extracted_src/**/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release on v* tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: extracted_src/**/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
